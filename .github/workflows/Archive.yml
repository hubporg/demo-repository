name: Archive Analytics

on:
  schedule:
    # 每天北京时间 01:00
    - cron: "0 1 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download analytics
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p DataArchive

          DATE=$(TZ=Asia/Shanghai date +%F)
          FILE="DataArchive/${DATE}.json"

          curl \
            --fail \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            -L \
            -H "Accept: application/json" \
            "https://addon-analytics.hubp.org/stats/summary" \
            -o "$FILE"

          # 验证返回是否为 JSON
          jq empty "$FILE" >/dev/null

      - name: Merge last 60 days
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE_DIR="DataArchive"
          OUT="${ARCHIVE_DIR}/last60days.json"
          WINDOW_DAYS=60

          CUTOFF=$(TZ=Asia/Shanghai date -d "${WINDOW_DAYS} days ago" +%F)
          NOW=$(TZ=Asia/Shanghai date +%Y-%m-%dT%H:%M:%S%:z)

          # 只挑 YYYY-MM-DD.json 形式的源数据，合并产物不参与
          FILES=()
          for f in "${ARCHIVE_DIR}"/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].json; do
            [ -e "$f" ] || continue
            d="${f##*/}"
            d="${d%.json}"
            if [[ "$d" > "$CUTOFF" || "$d" == "$CUTOFF" ]]; then
              FILES+=("$f")
            fi
          done

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No daily files within the last ${WINDOW_DAYS} days; leaving ${OUT} untouched."
            exit 0
          fi

          mapfile -t FILES < <(printf '%s\n' "${FILES[@]}" | sort)

          RECORDS=$(mktemp)
          trap 'rm -f "$RECORDS"' EXIT
          : > "$RECORDS"

          for f in "${FILES[@]}"; do
            d="${f##*/}"
            d="${d%.json}"
            if jq empty "$f" >/dev/null 2>&1; then
              jq -c --arg d "$d" '{date: $d, data: .}' "$f" >> "$RECORDS"
            else
              echo "::warning::skipping invalid JSON: $f" >&2
            fi
          done

          jq -s \
            --arg generated_at "$NOW" \
            --argjson window_days "$WINDOW_DAYS" \
            '{generated_at: $generated_at, window_days: $window_days, from: .[0].date, to: .[-1].date, count: length, records: .}' \
            "$RECORDS" > "$OUT"

          jq empty "$OUT" >/dev/null
          echo "Wrote ${OUT}: $(jq -r '.count' "$OUT") days ($(jq -r '.from' "$OUT") -> $(jq -r '.to' "$OUT"))"

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add DataArchive

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Archive analytics $(TZ=Asia/Shanghai date +%F)"
          git push
